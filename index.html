<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>경기도 수업실연</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-secondary: #86868b;
      --border-color: rgba(0, 0, 0, 0.08);
      --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro KR", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-banner {
      display: inline-block;
      width: 100%;
      padding: 22px 36px;
      border: 1px solid var(--border-color);
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.03);
      box-shadow: var(--shadow-sm);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--text-main);
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    main {
      display: grid;
      gap: 14px;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 22px 24px;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      background: var(--card-bg);
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      border-color: rgba(0, 0, 0, 0.18);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.07);
    }

    .card h2 {
      margin: 0;
      font-size: 1.08rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .card a {
      flex: 0 0 auto;
      padding: 8px 14px;
      border: 1px solid var(--text-main);
      border-radius: 8px;
      background: var(--text-main);
      color: white;
      font-size: 0.88rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .card a:hover,
    .card a:focus-visible {
      opacity: 0.78;
    }

    @media (max-width: 680px) {
      body {
        padding: 16px 12px;
      }

      .header-banner {
        padding: 20px;
      }

      h1 {
        font-size: 1.55rem;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header class="header">
    <div class="header-banner">
      <span class="eyebrow">Textbook Archive</span>
      <h1>경기도 수업실연</h1>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>지도서</h2>
      <a href="https://molla106.github.io/textbook/">보러 가기</a>
    </div>
    
    <div class="card">
      <h2>수업 나눔</h2>
      <a href="수업 나눔.html">문제 생성</a>
    </div>
    
    <div class="card">
      <h2>수업 설계 역량</h2>
      <a href="수업 설계 역량.html">문제 생성</a>
    </div>

    <div class="card">
      <h2>수업 설계 역량 2</h2>
      <a href="gkqrur/수업설계역량(합격선).html">문제 생성</a>
    </div>
  </main>
</div>
</body>
</html>
