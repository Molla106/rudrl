<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수업 설계 역량(구상형)</title>
  <style>
    :root {
      --bg-color: #f5f5f7;
      --card-bg: #ffffff;
      --text-main: #1d1d1f;
      --text-secondary: #86868b;
      --border-color: rgba(0, 0, 0, 0.08);
      --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro KR", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header-banner {
      display: inline-block;
      width: 100%;
      padding: 22px 36px;
      border: 1px solid var(--border-color);
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.03);
      box-shadow: var(--shadow-sm);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--text-main);
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    .result-card {
      padding: 32px;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      background: var(--card-bg);
      box-shadow: var(--shadow-sm);
      text-align: center;
    }

    .action-button {
      display: block;
      margin: 0 auto 24px;
      padding: 9px 16px;
      border: 1px solid var(--text-main);
      border-radius: 8px;
      background: var(--text-main);
      color: white;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .action-button:hover,
    .action-button:focus-visible {
      opacity: 0.78;
    }

    .problem-image,
    .all-img {
      display: block;
      width: 100%;
      max-width: 640px;
      height: auto;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--card-bg);
      box-shadow: var(--shadow-sm);
      object-fit: contain;
    }

    .problem-image {
      margin: 0 auto 24px;
    }

    .all-problems[hidden] {
      display: none;
    }

    .all-problems {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
    }

    @media (max-width: 680px) {
      body {
        padding: 16px 12px;
      }

      .header-banner,
      .result-card {
        padding: 20px;
      }

      h1 {
        font-size: 1.55rem;
      }

      .problem-image,
      .all-img {
        padding: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-banner">
        <span class="eyebrow">Textbook Archive</span>
        <h1>수업 설계 역량(구상형)</h1>
      </div>
    </header>

    <main class="result-card">
      <button type="button" class="action-button" onclick="generateProblem()">문제 생성</button>
      <img id="problemImage" class="problem-image" src="0.png" alt="문제를 생성해주세요">
      <button type="button" class="action-button" id="allProblemsToggle" onclick="toggleAllProblems()">전체 문제 보기</button>
      <div id="allProblems" class="all-problems" hidden></div>
    </main>
  </div>

  <script>
    // 이미지 목록 생성 (1.png ~ 27.png)
    const images = [];
    for (let i = 1; i <= 27; i++) {
      images.push(i + ".png");
    }

    let lastIndex = -1;

    function generateProblem() {
      let randomIndex;

      do {
        randomIndex = Math.floor(Math.random() * images.length);
      } while (randomIndex === lastIndex);

      lastIndex = randomIndex;
      document.getElementById("problemImage").src = images[randomIndex];
    }

    function toggleAllProblems() {
      const container = document.getElementById("allProblems");
      const toggle = document.getElementById("allProblemsToggle");

      if (container.hidden) {
        container.replaceChildren();
        for (let i = 1; i <= 27; i++) {
          const img = document.createElement("img");
          img.src = i + ".png";
          img.className = "all-img";
          img.alt = `수업 설계 역량 문제 ${i}`;
          container.appendChild(img);
        }
        container.hidden = false;
        toggle.textContent = "전체 문제 접기";
      } else {
        container.hidden = true;
        toggle.textContent = "전체 문제 보기";
      }
    }
  </script>

</body>
</html>
