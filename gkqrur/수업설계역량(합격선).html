<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>수업 설계 역량(구상형)</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    button {
        display: block;
        margin: 20px auto 20px auto; /* 버튼 아래쪽 간격을 20px로 줄임 */
        padding: 10px 20px;
        font-size: 16px;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #2980b9;
    }

    #problemImage {
      margin-top: 20px;
      max-width: 80%;
      border: 2px solid #000000;
      padding: 10px;
    }

    #allProblems {
      margin-top: 40px;
      display: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .all-img {
      width: 80%;
      max-width: 600px;
      margin: 15px 0;
      border: 2px solid #000000;
      padding: 10px;
    }
  </style>
</head>
<body>

  <h2>수업 설계 역량(구상형)</h2>

  <button onclick="generateProblem()">문제 생성</button>

  <div>
    <img id="problemImage" src="0.png" alt="">
  </div>

  <button onclick="toggleAllProblems()">전체 문제 보기</button>

  <div id="allProblems"></div>

  <script>
    // 이미지 목록 생성 (1.png ~ 27.png)
    const images = [];
    for (let i = 1; i <= 27; i++) {
      images.push(i + ".png");
    }

    let lastIndex = -1;

    function generateProblem() {
      let randomIndex;

      do {
        randomIndex = Math.floor(Math.random() * images.length);
      } while (randomIndex === lastIndex);

      lastIndex = randomIndex;
      document.getElementById("problemImage").src = images[randomIndex];
    }

    function toggleAllProblems() {
      const container = document.getElementById("allProblems");

      if (container.style.display === "none") {
        container.innerHTML = "";
        for (let i = 1; i <= 27; i++) {
          const img = document.createElement("img");
          img.src = i + ".png";
          img.className = "all-img";
          container.appendChild(img);
        }
        container.style.display = "flex";
        container.style.flexDirection = "column";
        container.style.alignItems = "center";
      } else {
        container.style.display = "none";
      }
    }
  </script>

</body>
</html>
