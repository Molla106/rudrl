<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업 설계 역량(구상형)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4; /* 페이지 배경색 (변경하지 않음) */
            color: #333; /* 글자색 (변경하지 않음) */
        }
        
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        
        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            color: #2c3e50;
        }

        button {
            display: block;
            margin: 20px auto 20px auto; /* 버튼 아래쪽 간격을 20px로 줄임 */
            padding: 10px 20px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        #result {
            font-size: 16px;
            line-height: 1.6;
            margin-top: 20px;
        }

        #result br {
            margin-bottom: 10px;
        }

        /* 네모 박스 스타일 수정 */
        .question-container {
            margin-bottom: 20px;
            border: 2px solid #000000; /* 테두리 색을 검정색으로 */
            padding: 10px 20px;
            background-color: transparent; /* 배경색을 투명으로 설정 */
            font-weight: bold; /* 질문 문장 굵게 */
        }

        .question-number {
            font-weight: bold; /* 질문 번호 굵게 */
            color: #000000; /* 질문 번호 텍스트 색을 검정색으로 */
            background-color: transparent; /* 배경색 제거 */
        }

        .question-title {
            font-weight: bold; /* [문항] 부분 굵게 */
        }

    </style>
</head>
<body>

    <div class="container">
        <h2>수업 설계 역량(구상형)</h2>
        
        <!-- 버튼을 클릭하면 랜덤 문장이 표시됨 -->
        <div class="button-container">
            <button onclick="pickSentence()">문제 생성</button>
        </div>

  <div id="sentence" class="question-container"></div>

        <!-- 전체 문제 보기 버튼을 하단에 배치 -->
        <div class="button-container bottom">
            <button onclick="showAllSentences()">전체 문제 보기</button>
        </div>

  <script>

    const sentences = [

    //수업 철학

"오늘 수업에서 선생님이 의도한 배움은 무엇이며 그러한 것을 반영하기 위해 수업을 어떻게 설계하였는지 말씀해 보세요.",

"자신이 중요하게 생각하는 가치, 덕목을 중심으로 오늘 수업을 설계한 점에 대해 설명해 보고 그것의 효과(기대할 수 있는 점)에 대해 말씀해 보세요.",

    //수업 설계 일반

"오늘 수업에서 인지적인 측면과 정의적인 측면에서의 학생의 성장을 돕기 위해 계획한 점을 말씀해 보세요.",

"학생의 자기 주도성 신장이라는 측면에서 오늘 수업을 어떻게 계획하였는지에 대해 도입 전개 정리의 흐름에 따라 설명해 보세요.",

"학생들의 학습 동기 유발을 위해 수업을 구성한 측면에 대해 말씀해 보세요.",

    //의사소통, 관계맺기

"수업에서 교사와 학생, 학생과 학생간의 상호작용이 활발히 일어나도록 수업을 구성한 측면과 이를 통해 어떠한 성장을 기대할 수 있을지에 대해 말씀해 보세요.",

"삶에 필요한 역량을 기르기 위해 소통과 협력을 중요시하며 자발적 배움이 일어나는 수업을 지행해야 합니다. 이를 위해 수업을 어떻게 구성할 수 있을지 오늘 수업과 관련하여 말씀해 보세요.",

    //수업설계시 어려움과 고민

"오늘 수업을 설계하는데 있어서 어려움을 느낀 부분에 대해 말해 보고 다음 수업에서 이와 관련한 보완점이나 개선방안에 대해 말씀해 보세요.",

"수업 설계 과정에서 고민이 되었던 부분에 대해 이유와 함께 말해 보고 이에 대해 동료교사와 협력하는 방안에 대해 말씀해 보세요.",

    //배중중심수업, 깊이있는수업

"학생의 삶에 필요한 역량을 기르기 위한 자발적 배움이 일어나도록 수업을 설계한 측면에 대해 말씀 해 보세요.",

"오늘 수업을 통해 학생에게 어떤 성장이 일어날 수 있다고 생각하는지 말해 보고 이를 고려하여 오늘 수업을 설계한 측면에 대해 말씀해 보세요.",

    //창의적 사고 역량

"경기 교육에서는 학생이 기본 학력을 갖춘 인재로 성장할 수 있도록 역량 기반 교육을 강화하고 있다. 이러한 측면에서 역량 함양을 위해 수업을 계획한 측면에 대해 말씀해 보세요.",

"경기도 교육과정에서는 미래 사회에 요구하는 역량으로 새롭고 의미 있는 것을 창출하는 창의적 사고 역량을 중시하고 있습니다. 이러한 역량을 함양하기 위해 오늘 수업을 구성한 측면과 그 이유에 대해 말씀해 보세요.",

    //지역사회 연계

"해당 단원에 대해 지역(마을)과 연계해서 경험을 확장하는 것이 중요하다. 이를 위한 방안을 오늘의 수업과 관련하여 말씀해 보세요.",

    //타 교과 연계, 융합수업

"오늘 수업 주제를 학생의 삶과 연계하여 융합수업을 설계한다면, 그 주제와 방법, 고려할 점을 말씀해 주십시오.",

"오늘 수업을 타 교과와 연계한 수업으로 구성할 경우 어떤 과목이 적절한지에 대해 말해 보고 타 과와 연계한 수업을 하는 방안에 대해 말씀해 보세요.",

"깊이 있는 수업을 하기 위해 동교과와 타교과와 협력하여 수업을 계획할 경우 어떤 수업을 디자인할 있는지와 그로 인한 기대 효과에 대해 말씀해 보세요.",

    //깊이 있는 학습
    // 깊이 있는 학습: 학생의 개념 이해를 바탕으로 삶의 맥락을 반영한 문제를 해결하는 학습을 강조하는 수업으로서 비판적 사고 및 문제해결 역량 등 미래 역량을 향상시키는데 중점을 둠)

"경기도에서 추구하는 깊이있는 수업의 관점에서 수업의 흐름을 설명해 보고 이러한 관점에서 가장 미있게 구성한 부분을 말씀해 보세요.",

"깊이 있는 학습에서는 학생의 비판적 사고, 문제해결역량 함양을 강조하고 있습니다. 이를 위해 한 교수 학습 전략에 대해 말씀해 보세요.",

    //질문과 탐구

"오늘 수업에서 학생의 자발적인 질문과 탐구가 일어나도록 수업을 구성한 측면에 대해 설명해 보고 그와 관련하여 학생들의 성장 측면에서의 의의에 대해 말씀해 보세요.",

    //독서교육

"오늘 수업의 주제와 관련한 지식이해, 과정기능, 가치태도는 무엇이며 이를 위해 수업을 어떻게 설계 하였는지에 대해 말씀해 보세요. 또한 이와 관련한 독서 교육 지도 방안에 대해 말씀해보세요.",

    //학교 밖의 지원 방안

"오늘 수업과 관련하여 학생들에게 학습 기회를 확대하기 위해 학교 안과 학교 밖의 활동을 지원하는 방안에 대해 말씀해 보세요.",

    //자기 주도성

"경기도 교육에서는 학생이 자신의 진로를 설계하고 자신의 삶을 스스로 개척해 나가는 자기 주도성 신장을 중요시한다. 이를 위해 수업을 구성한 측면에 대해 말씀해 보세요.",

    //맞춤형/수준차

"어떤 경우 수업에서 학생들에 소외될 수 있다고 생각하는지 말해보고 이와 같이 소외되는 학생들을 위해 오늘 수업을 계획한 측면에 대해 말씀해 보세요.",

"모든 학생에게 공평한 배움이 일어나도록 하기 위해 오늘 수업을 구성한 부분에 대해 이유와 함께 말씀해 보세요.",

"단 한명의 학생도 소외되지 않도록 하기 위해 수업을 계획한 측면에 대해 말씀해 보세요.",

"오늘 수업의 성취기준과 관련하여 미흡한 학생, 우수한 학생들에 대해 지식(기능)과 태도 측면에서 각각 어떠한 피드백을 할 수 있는지에 대해 말씀해 보세요.",

"오늘 수업과 관련하여 학생의 특성의 차이를 고려하여 지도하기 위해 학교 밖과 학교 안의 지원 방안을 각각 말씀하시오.",

    //평가

"오늘 수업에서 계획한 평가 방법과 그 이유에 대해 말씀해 보세요. 학생의 성장을 위해 이 평가를 어떻게 활용할 수 있을지 말씀해 보세요.",

"오늘 수업의 성취기준에 도달하지 못한 학생들을 위해 계획한 활동과 그러한 활동이 학생에게 어떤 의미가 있는지에 대해 말씀해 보세요.",

"온오프라인 연계한 성장중심 평가방안을 해당 단원과 연계한다면 어떻게 계획할 것인지에 대하여 말하시오.",

    //에듀테크

"에듀테크를 통합 협력적 소통 역량 강화를 위한 방안을 오늘 수업과 관련하여 말씀해 보세요.",

"오늘 수업에서 온라인을 활용한 형성평가를 할 수 있는 방안과, 디지털 시민의식 함양을 위한 지도 방안 2가지를 말씀해 보세요.",

"오늘 수업에서 맞춤형 수업을 위한 디지털 기기 활용 방안과 피드백 방안에 대해 말씀해 보세요.",

    //추가 문항

"오늘 수업에서 교사가 가장 중점적으로 고려한 학습자 특성은 무엇이며, 이 특성이 수업 목표·내용·활동 설계에 어떻게 반영되었는지 설명해 보세요.",

"오늘 수업에서 학생이 ‘정답을 맞히는 것’보다 ‘생각하는 과정’을 경험하도록 하기 위해 설계 단계에서 고려한 점을 말씀해 보세요.",

"오늘 수업의 도입 활동이 전체 수업의 방향과 어떻게 연결되도록 설계되었는지, 도입 단계에서 교사가 의도한 역할을 중심으로 설명해 보세요.",

"오늘 수업에서 학습 활동과 평가가 분리되지 않도록 수업 설계 단계에서 어떤 점을 고려하였는지 말씀해 보세요.",

"오늘 수업을 설계하면서 학생 간 상호작용이 자연스럽게 발생하도록 학습 환경과 활동 구조를 어떻게 설계하였는지 설명해 보세요.",

"오늘 수업에서 교사가 개입해야 하는 순간과 학생에게 맡겨야 하는 순간을 어떻게 구분하여 설계하였는지 말씀해 보세요.",

"오늘 수업에서 학생의 실패 경험이 학습으로 전환될 수 있도록 수업 설계 단계에서 고려한 안전장치(구조, 발문, 활동)를 설명해 보세요.",

"오늘 수업을 설계하면서 ‘모든 학생이 최소한 어디까지는 도달해야 하는가’를 어떻게 설정하였으며, 이를 수업에 어떻게 반영하였는지 말씀해 보세요.",

"오늘 수업을 설계하며 가장 고민이 되었던 선택 한 가지를 제시하고, 다른 대안 대신 그 선택을 한 이유를 말씀해 보세요.",

"오늘 수업에서 학생의 자기 점검과 성찰이 일어나도록 수업의 어느 지점에 어떤 장치를 설계하였는지 설명해 보세요.",

"오늘 수업을 깊이 있는 학습의 관점에서 설계하기 위해 ‘활동의 수’보다 ‘사고의 깊이’를 어떻게 확보하고자 하였는지 말씀해 보세요.",

];

    function pickSentence() {
      const randomIndex = Math.floor(Math.random() * sentences.length);
      document.getElementById("sentence").innerText = sentences[randomIndex];
    }

    function showAllSentences() {
      const allSentences = sentences.map((sentence, index) => `${index + 1}. ${sentence}`).join('<br><br>');
      document.getElementById("sentence").innerHTML = allSentences;
    }
  </script>

</body>
</html>
